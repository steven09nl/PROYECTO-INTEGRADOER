<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Prácticas - Iniciar Sesión</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0px 10px 40px rgba(0,0,0,0.25);
        }

        .login-left {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            color: white;
            padding: 40px;
        }

        .login-left h1 {
            font-weight: 700;
        }

        .login-right {
            background: white;
            padding: 40px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
        }

        .btn-login {
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-md-10">
                <div class="card login-card">
                    <div class="row g-0">

                        <div class="col-md-5 login-left d-flex flex-column justify-content-center">
                            <h1 class="mb-3">Sistema de Prácticas</h1>
                            <p class="mb-0">
                                Accede con tu correo institucional para gestionar tus prácticas de manera segura y organizada.
                            </p>
                        </div>

                        <div class="col-md-7 login-right">
                            <h2 class="mb-4 fw-bold text-dark">Iniciar Sesión</h2>

                            <form id="loginForm">

                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                                    <input type="email" id="email" name="email" class="form-control"
                                        placeholder="ejemplo@correo.com" required>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label fw-semibold">Contraseña</label>
                                    <input type="password" id="password" name="password" class="form-control"
                                        placeholder="********" required>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 btn-login">
                                    Ingresar
                                </button>
                            </form>

                            <p id="mensajeError" class="text-danger mt-3 fw-semibold" style="display: none;"></p>

                            <hr class="my-4">

                            <p class="text-muted small mb-0">
                                © 2026 Sistema de Prácticas - Universidad
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>

</body>
</html>
