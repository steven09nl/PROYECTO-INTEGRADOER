<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Estudiante - Registro de Horas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .navbar-custom {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
        }

        .card-custom {
            border: none;
            border-radius: 18px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.08);
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
        }

        .btn-custom {
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }

        .info-box {
            background: rgba(13, 110, 253, 0.08);
            border: 1px solid rgba(13, 110, 253, 0.2);
            padding: 15px;
            border-radius: 14px;
            font-size: 14px;
            color: #0d6efd;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Sistema de Prácticas</a>
            <span class="navbar-text text-white fw-semibold">
                Panel Estudiante
            </span>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-10">

                <div class="card card-custom p-4">

                    <h2 class="fw-bold mb-2 text-dark">Registrar Horas Diarias</h2>
                    <p class="text-muted mb-4">
                        Completa tu registro diario de entrada y salida para mantener tu bitácora actualizada.
                    </p>

                    <div class="info-box mb-4">
                        📌 Recuerda registrar tus horas diariamente para evitar retrasos en la validación de tu práctica.
                    </div>

                    <input type="hidden" id="idBitacora" value="1">

                    <form id="horasForm">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Fecha</label>
                            <input type="date" id="fecha" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Hora de Entrada</label>
                            <input type="time" id="horaEntrada" class="form-control" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Hora de Salida</label>
                            <input type="time" id="horaSalida" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-custom">
                            Registrar Horas
                        </button>

                    </form>

                    <p id="mensaje" class="mt-3 fw-semibold"></p>

                </div>

                <div class="text-center mt-4 text-muted small">
                    © 2026 Sistema de Prácticas - Registro de Horas
                </div>

            </div>
        </div>

    </div>

    <script src="js/panel_estudiante.js"></script>

</body>
</html>
