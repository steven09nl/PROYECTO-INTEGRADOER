<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Sistema de Prácticas</title>
</head>
<body>

  <h2>Inicio de Sesión</h2>

  <label>Email:</label><br>
  <input type="email" id="email"><br><br>

  <label>Password:</label><br>
  <input type="password" id="password"><br><br>

  <button onclick="login()">Ingresar</button>

  <p id="msg"></p>

  <script>
    const API_URL = "http://localhost:8080/api/auth";

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const response = await fetch(`${API_URL}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      if (!response.ok) {
        document.getElementById("msg").innerText = "❌ Credenciales incorrectas o usuario inactivo";
        return;
      }

      const usuario = await response.json();
      localStorage.setItem("usuario", JSON.stringify(usuario));

      if (usuario.rol === "ADMIN") {
        window.location.href = "admin.html";
      } else if (usuario.rol === "ESTUDIANTE") {
        window.location.href = "estudiante.html";
      } else if (usuario.rol === "ASESOR") {
        window.location.href = "asesor.html";
      } else {
        document.getElementById("msg").innerText = "⚠ Rol no reconocido";
      }
    }
  </script>

</body>
</html>
