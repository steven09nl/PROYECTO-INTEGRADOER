<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Completar Bitácora</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #f4f6f9;
        }

        .navbar-custom {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
        }

        .card-custom {
            border: none;
            border-radius: 18px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.08);
        }

        .btn-custom {
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 600;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
        }

        textarea.form-control {
            resize: none;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Sistema de Prácticas</a>
            <span class="navbar-text text-white fw-semibold">
                Panel Estudiante
            </span>
        </div>
    </nav>

    <input type="hidden" id="idBitacora" value="1">
    <input type="hidden" id="idPractica" value="1">

    <div class="container mt-5">

        <!-- CARD PREGUNTAS -->
        <div class="card card-custom p-4 mb-5">
            <h2 class="fw-bold mb-3">Mi Bitácora</h2>
            <p class="text-muted mb-4">
                Responde las preguntas asignadas a tu práctica y adjunta evidencias de tu proceso.
            </p>

            <h4 class="fw-semibold mb-3">Responder Preguntas de la Práctica</h4>

            <div id="contenedorPreguntas" class="mt-3">
                <!-- Aquí el JS carga las preguntas -->
            </div>
        </div>

        <!-- CARD EVIDENCIA -->
        <div class="card card-custom p-4">
            <h4 class="fw-semibold mb-3">Subir Evidencia</h4>

            <form id="formEvidencia">

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Enlace del archivo (Google Drive, GitHub, etc.)
                    </label>
                    <input type="url" id="urlArchivo" class="form-control" placeholder="https://..." required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Descripción de la Evidencia</label>
                    <input type="text" id="descripcion" class="form-control" placeholder="Ej: Evidencia del día 1..." required>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-custom">
                    Enviar Evidencia
                </button>
            </form>
        </div>

        <div class="text-center mt-4 text-muted small">
            © 2026 Sistema de Prácticas - Bitácora Estudiante
        </div>

    </div>

    <script src="js/bitacora_estudiante.js"></script>
</body>
</html>
